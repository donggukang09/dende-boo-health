<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#FAF6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="건강기록">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>덴데·부우 건강기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#FAF6F1;--card:#fff;--ink:#2B2622;--sub:#8C827A;--faint:#B9AFA6;--line:#EFE7DE;--soft:#F5EFE8;
  --accent:#E07A4F;--accent-soft:#FBEDE6;
  --good:#2E9E6A;--good-soft:#E6F5EE;--watch:#D9932B;--watch-soft:#FDF3E1;--alert:#D64545;--alert-soft:#FCE9E9;--info:#5B7FB8;--info-soft:#EAF0F9;
  --r:18px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;letter-spacing:-.01em}
body{padding-bottom:calc(76px + var(--safe-b))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none;font-size:16px}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(250,246,241,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:50px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.03em}
.brand small{font-weight:600;color:var(--sub);font-size:12px;margin-left:6px}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.dot.pend{background:var(--watch)}.dot.err{background:var(--alert)}.dot.local{background:var(--faint)}
.dot.spin{background:var(--info);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar .wrap{display:flex;padding:0 4px}
.tabbar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 9px;font-size:11.5px;color:var(--sub);font-weight:600}
.tabbar button i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.55}
.tabbar button.on{color:var(--ink)}
.tabbar button.on i{filter:none;opacity:1}
.tabbar .bdg{position:absolute;top:4px;left:50%;margin-left:7px;background:var(--alert);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;font-style:normal}
/* common */
.card{background:var(--card);border-radius:var(--r);padding:15px;margin:12px 0;box-shadow:0 1px 0 rgba(60,40,20,.04),0 4px 14px rgba(60,40,20,.04)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .more{font-size:13px;font-weight:600;color:var(--sub)}
.muted{color:var(--sub)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--soft);font-size:14.5px}
.btn.pri{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--sub);white-space:nowrap}
.empty{color:var(--faint);text-align:center;padding:14px 0;font-size:13.5px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
/* date & cat */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.datebar .nav{width:40px;height:40px;border-radius:12px;background:#fff;font-size:20px;color:var(--sub)}
.datebar .dlabel{position:relative;font-weight:800;font-size:17px;padding:6px 12px}
.datebar .dlabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
.datebar .dlabel small{font-weight:700;color:var(--accent);font-size:12px;margin-left:4px}
.catseg{display:flex;gap:8px;margin:10px 0 2px}
.catseg button{flex:1;background:#fff;border-radius:16px;padding:10px 8px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:16px;border:2px solid transparent;color:var(--sub)}
.catseg button.on{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 9%,#fff)}
.catseg .em{font-size:22px}
.catseg .since{font-size:11px;font-weight:700;color:#fff;background:var(--c);border-radius:99px;padding:1px 7px}
/* alerts */
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:14px;font-weight:600}
.al.alert{background:var(--alert-soft);color:#8E2626}.al.watch{background:var(--watch-soft);color:#7A5210}.al.info{background:var(--info-soft);color:#2F4C7A}.al.good{background:var(--good-soft);color:#1E6B47}
.al i{font-style:normal}
/* quick grid */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{position:relative;background:var(--soft);border-radius:16px;padding:12px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:82px}
.qbtn:active{transform:scale(.96)}
.qbtn i{font-style:normal;font-size:27px;line-height:1.1}
.qbtn b{font-size:13px;font-weight:700}
.qbtn s{text-decoration:none;font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%}
.qbtn .cnt{position:absolute;top:6px;right:6px;min-width:19px;height:19px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px}
.sumgrid div{display:flex;gap:6px;align-items:baseline;font-size:13.5px;min-width:0}
.sumgrid div span:first-child{flex:none}
.sumgrid div span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* meds */
.med{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.med:first-of-type{border-top:0}
.chk{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:16px}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.bad{background:var(--watch);border-color:var(--watch)}
.chk.late{border-color:var(--alert)}
.slot{font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px;flex:none}
/* issues */
.iss{padding:10px 0;border-top:1px solid var(--line)}
.iss:first-of-type{border-top:0;padding-top:2px}
.tri{display:flex;gap:6px;margin-top:8px}
.tri button{flex:1;padding:9px 0;border-radius:11px;background:var(--soft);font-weight:700;font-size:13.5px}
.tri button.on.악화{background:var(--alert);color:#fff}.tri button.on.같음{background:var(--watch);color:#fff}.tri button.on.호전{background:var(--good);color:#fff}
/* timeline */
.tl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.tl:first-of-type{border-top:0}
.tl .ic{width:36px;height:36px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.tl .tm{font-size:12px;color:var(--sub);font-weight:700}
.tl .tx{font-weight:600;font-size:14.5px}
.tl .nt{font-size:13px;color:#5E554E;white-space:pre-wrap;margin-top:2px}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--soft)}
/* chips */
.fl{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 13px;border-radius:99px;background:var(--soft);font-weight:700;font-size:14px;border:1.5px solid transparent}
.chip.on{background:var(--accent);color:#fff}
.chip.add{background:#fff;border:1.5px dashed var(--faint);color:var(--sub)}
.chips.big .chip{padding:12px 15px;font-size:15px}
.chips.face .chip{font-size:28px;padding:6px 8px;background:transparent;opacity:.45;border-radius:14px}
.chips.face .chip.on{opacity:1;background:var(--accent-soft);color:inherit}
.scale .chip{flex:1;text-align:center;padding:12px 4px;font-size:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:14px;background:var(--soft);font-size:22px;font-weight:700}
.stepper input{width:80px;text-align:center;font-size:20px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.sh-bg{position:absolute;inset:0;background:rgba(30,20,10,.38);animation:fade .18s}
.sh-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:6px 16px calc(16px + var(--safe-b));max-width:560px;margin:0 auto;animation:up .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sh-grip{width:40px;height:5px;border-radius:9px;background:#DDD3C9;margin:4px auto 8px}
.sh-head{display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:800;padding:2px 0 4px}
.sh-head .x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:16px}
.sh-foot{position:sticky;bottom:calc(-16px - var(--safe-b));background:var(--bg);padding:12px 0 calc(16px + var(--safe-b));margin-bottom:calc(-16px - var(--safe-b));display:flex;gap:8px}
.sh-foot .btn{padding:15px;font-size:16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);z-index:60;background:#2B2622;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw}
#toast[hidden]{display:none}
#toast button{color:#FFC59F;font-weight:800}
#toast.err{background:var(--alert)}
/* segmented small */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin:10px 0}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
/* brief */
.lvl{border-radius:16px;padding:14px 15px;color:#fff;margin:12px 0 4px}
.lvl.good{background:var(--good)}.lvl.watch{background:var(--watch)}.lvl.alert{background:var(--alert)}.lvl.none{background:#8C827A}
.lvl b{font-size:13px;opacity:.9}
.lvl p{margin:4px 0 0;font-size:17px;font-weight:800;line-height:1.35}
.bcat h4{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:center}
.daygrid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px;margin:8px 0;background:var(--soft);border-radius:12px;padding:10px 12px}
.daygrid span:nth-child(odd){color:var(--sub);font-weight:700;white-space:nowrap}
.blist{margin:4px 0 8px;padding-left:0;list-style:none}
.blist li{padding:6px 0 6px 22px;position:relative;font-size:14px;border-bottom:1px dashed var(--line)}
.blist li:last-child{border-bottom:0}
.blist li:before{content:"•";position:absolute;left:7px;color:var(--sub)}
.blist.bad li:before{content:"!";color:var(--alert);font-weight:900}
.blist.ok li:before{content:"✓";color:var(--good);font-weight:900}
.blist li .addtodo{float:right;font-size:11.5px;font-weight:700;color:var(--accent);margin-left:6px}
.dates{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:none;padding:7px 11px;border-radius:99px;background:#fff;font-weight:700;font-size:13px;border:1.5px solid var(--line);display:flex;gap:5px;align-items:center}
.dates button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.ld{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}
.ld.good{background:var(--good)}.ld.watch{background:var(--watch)}.ld.alert{background:var(--alert)}
.md h2{font-size:15.5px;margin:16px 0 6px}.md h3{font-size:14.5px;margin:12px 0 4px}.md p{margin:4px 0}.md ul{margin:4px 0;padding-left:20px}.md li{margin:2px 0}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes rot{to{transform:rotate(360deg)}}
/* charts */
.chart{margin:4px 0 14px}
.chart .ct{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;margin-bottom:2px}
.chart .ct span{font-weight:600;color:var(--sub);font-size:12px}
.chart svg{width:100%;height:auto;display:block}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{color:var(--sub);font-weight:700;padding:6px 2px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
table.dt td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}
table.dt td:first-child{text-align:left;font-weight:700;white-space:nowrap}
table.dt tr{cursor:pointer}
.sc0{color:var(--alert);font-weight:800}.sc1{color:var(--alert)}.sc2{color:var(--watch);font-weight:700}.sc3{color:var(--ink)}.sc4{color:var(--good);font-weight:700}
/* visits & labs */
.vis{padding:11px 0;border-top:1px solid var(--line)}
.vis:first-of-type{border-top:0}
.labchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lc{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft)}
.lc.H{background:var(--alert-soft);color:var(--alert)}.lc.L{background:var(--info-soft);color:var(--info)}
.labrow{display:grid;grid-template-columns:1.1fr 1fr .8fr;gap:6px;margin-bottom:4px;align-items:center}
.labrow input{padding:9px 8px;font-size:15px}
.labrow .tn{font-weight:800;font-size:14px}
.labref{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px;align-items:center;margin:0 0 10px;font-size:12px;color:var(--sub)}
.labref input{padding:6px 8px;font-size:13px;border-radius:9px}
/* todo */
.todo{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo .tt{font-weight:700;font-size:15px}
.todo.done .tt{text-decoration:line-through;color:var(--faint)}
.kind{font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px}
.k구매{background:#FDEBD9;color:#A35A1D}.k개선{background:#E8F1E3;color:#3E7A2C}.k확인{background:var(--info-soft);color:var(--info)}.k예약{background:#F1E6F7;color:#7A3F99}.k기타{background:var(--soft);color:var(--sub)}
/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);gap:10px}
.set-row:first-of-type{border-top:0}
.foot{text-align:center;color:var(--faint);font-size:11px;letter-spacing:.12em;font-weight:700;padding:18px 0 8px}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
.lightbox img{max-width:100%;max-height:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{position:relative}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:12px}
.thumbs .t button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#2B2622;color:#fff;font-size:12px}
details.fold summary{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 4px;cursor:pointer}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">덴데·부우<small>건강기록</small></div>
  <button class="sync" data-a="syncnow" id="sync"><span class="dot local"></span><span>로컬</span></button>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabbar"><div class="wrap" id="tabs"></div></nav>
<div id="sheet" hidden><div class="sh-bg" data-a="close"></div><div class="sh-panel" id="shp"><div class="sh-grip"></div><div id="shc"></div></div></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* =====================================================================
   덴데·부우 건강기록 — DEVELOPED BY DONGGU KANG
   ===================================================================== */
const LS = { cfg:'dbh_cfg', data:'dbh_data', queue:'dbh_queue', ui:'dbh_ui' };
const SCALE = ['안먹음','많이줄음','줄음','같음','늘음'];
const SCORE = { 안먹음:0, 많이줄음:1, 줄음:2, 같음:3, 늘음:4 };
const SCALE_LABEL = { 안먹음:'안 먹음', 많이줄음:'많이 줄음', 줄음:'줄음', 같음:'평소랑 같음', 늘음:'늘음' };
const FACES = [['1','😿','많이 나쁨'],['2','😾','나쁨'],['3','😐','보통'],['4','😺','좋음'],['5','😸','아주 좋음']];
const SLOTS = ['아침','점심','저녁','자기전','필요시'];
const SLOT_DUE = { 아침:11, 점심:15, 저녁:22 };
const LAB_PRESET = [['BUN','mg/dL'],['CREA','mg/dL'],['SDMA','µg/dL'],['P(인)','mg/dL'],['K(칼륨)','mmol/L'],['Ca(칼슘)','mg/dL'],['ALB(알부민)','g/dL'],['HCT','%'],['USG(요비중)',''],['UPC',''],['혈압(SBP)','mmHg'],['체중','kg']];
const VISIT_KINDS = ['정기검진','진료','재진','입원','퇴원','응급','접종','기타'];
const TODO_KINDS = ['구매','개선','확인','예약','기타'];
const ISSUE_SUGG = ['식욕부진','구토 잦음','입냄새','침흘림','잇몸 붉음/구내염','눈곱/눈물','재채기/콧물','설사','변비','다음/다뇨','털 빠짐/피부','절뚝임','귀 긁음','수액 부위 부음'];
const DEFAULTS = {
  cats:[
    {name:'덴데',emoji:'🐱',color:'#E07A4F',birth:'2016-02-11',note:'만성신부전(CKD) — 2026년 11월 입원 치료 후 퇴원',sinceLabel:'퇴원',sinceDate:'2026-11-11',refWeight:''},

/* ---------- data ops ---------- */
function applyOp(op,d=D){
  if(op.action==='upsert'){
    const arr=d[op.sheet]||(d[op.sheet]=[]);
    const i=arr.findIndex(r=>r.id===op.record.id);
    const rec=Object.assign({},i>=0?arr[i]:{},op.record);
    if(!rec.created)rec.created=stamp();
    if(op.photos&&op.photos.length) rec._local=(rec._local||[]).concat(op.photos.map(p=>'data:'+p.mime+';base64,'+p.data));
    if(i>=0)arr[i]=rec;else arr.push(rec);
  }else if(op.action==='delete'){
    d[op.sheet]=(d[op.sheet]||[]).filter(r=>r.id!==op.id);
  }else if(op.action==='setting'){
    d.settings=Object.assign({},d.settings,{[op.k]:op.v});
  }
}
function commit(ops,opt={}){
  ops.forEach(op=>{op.opId=uid();applyOp(op);});
  if(cfg.url){Q.push(...ops);save(LS.queue,Q);}
  saveData();
  if(!opt.norender)render();
  if(cfg.url)flush();
}

/* ---------- network ---------- */
function jsonp(params,timeout=30000){
  return new Promise((res,rej)=>{
    const cb='cb_'+uid().replace(/\W/g,'');
    const s=document.createElement('script');
    const q=new URLSearchParams(Object.assign({},params,{key:cfg.key,callback:cb,_:Date.now()}));
    const done=()=>{clearTimeout(t);delete window[cb];s.remove();};
    const t=setTimeout(()=>{done();rej(new Error('응답 시간 초과'));},timeout);
    window[cb]=d=>{done();res(d);};
    s.onerror=()=>{done();rej(new Error('연결 실패'));};
    s.src=cfg.url+(cfg.url.includes('?')?'&':'?')+q.toString();
    document.head.appendChild(s);
  });
}
async function postOps(ops){
  const body=JSON.stringify({key:cfg.key,ops});
  let j=null;
  try{
    const r=await fetch(cfg.url,{method:'POST',body,headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'});
    j=await r.json();
  }catch(e){
    if(!navigator.onLine)throw new Error('오프라인');
    await fetch(cfg.url,{method:'POST',mode:'no-cors',body,headers:{'Content-Type':'text/plain;charset=utf-8'}});
    return {ok:true,opaque:true};
  }
  if(!j.ok)throw new Error(j.error==='unauthorized'?'접속 키가 맞지 않아요':j.error);
  return j;
}
async function flush(){
  if(!cfg.url||UI.flushing||!Q.length)return;
  if(!navigator.onLine){paintSync();return;}
  UI.flushing=true;paintSync();
  try{
    while(Q.length){
      const batch=[];let size=0;
      for(const op of Q){const s=JSON.stringify(op).length;if(batch.length&&(size+s>350000||batch.length>=25))break;batch.push(op);size+=s;}
      const res=await postOps(batch);
      (res.results||[]).forEach(r=>{if(!r.ok)toast('저장 오류: '+r.error,'err');});
      const ids=new Set(batch.map(o=>o.opId));
      Q=Q.filter(o=>!ids.has(o.opId));save(LS.queue,Q);
    }
    UI.err=null;
  }catch(e){UI.err=e.message;}
  finally{UI.flushing=false;paintSync();}
}
async function sync(quiet){
  if(!cfg.url){paintSync();return;}
  await flush();
  if(UI.loading)return;
  UI.loading=true;paintSync();
  try{
    const r=await jsonp({action:'load',days:cfg.days||120});
    if(!r.ok)throw new Error(r.error==='unauthorized'?'접속 키가 맞지 않아요':r.error);
    const nd=emptyData();
    ['logs','issues','visits','labs','todos','meds','briefs'].forEach(k=>nd[k]=r[k]||[]);
    nd.settings=r.settings||{};nd.sheetUrl=r.sheetUrl||'';nd.ai=r.ai||null;
    Q.forEach(op=>applyOp(op,nd));
    // keep local photo previews until server has them
    ['logs','visits'].forEach(k=>D[k].forEach(o=>{if(o._local){const n=nd[k].find(x=>x.id===o.id);if(n&&!n.photos)n._local=o._local;}}));
    D=nd;saveData();UI.err=null;UI.last=stamp();saveUI();
    render();
  }catch(e){UI.err=e.message;if(!quiet)toast('동기화 실패: '+e.message,'err');}
  finally{UI.loading=false;paintSync();}
}
function paintSync(){
  const el=$('#sync');if(!el)return;
  let cls='',txt='';
  if(!cfg.url){cls='local';txt='기기에만 저장';}
  else if(UI.flushing||UI.loading){cls='spin';txt='동기화 중';}
  else if(UI.err){cls='err';txt=Q.length?'대기 '+Q.length+'건':'연결 오류';}
  else if(Q.length){cls='pend';txt='대기 '+Q.length+'건';}
  else {txt=UI.last?'동기화 '+UI.last.slice(11,16):'연결됨';}
  el.innerHTML='<span class="dot '+cls+'"></span><span>'+txt+'</span>';
}

function activeMeds(cat,date){

function medRows(cat,date){

function logText(l){

  switch(l.type){
    case 'food':return (l.item||'사료')+' · '+(SCALE_LABEL[l.value]||l.value||'')+(q?' · '+q+'g':'');

    case 'snack':return (l.item||'간식')+' '+(q||1)+(l.unit||'개');
    case 'urine':return (num(q)>1?q+'덩어리 · ':'')+'크기 '+(l.value||'')+(l.item?' · '+l.item:'');
    case 'stool':return (l.value||'')+(l.item?' · '+l.item:'');

    case 'weight':{const ws=weightsOf(l.cat);const i=ws.findIndex(w=>w.id===l.id);let d='';if(i>0){const diff=num(l.qty)-num(ws[i-1].qty);d=' ('+(diff>=0?'+':'')+diff.toFixed(2)+')';}return q+' kg'+d;}

function alertsFor(cat,date){
  const A=[], isT=date===today(), H=new Date().getHours();

  const food=byType(L,'food'), s0=scoreAvg(food), s1=scoreAvg(byType(Lp,'food'));

  else if(s0!==null&&s1!==null&&s0<=2&&s1<=2)A.push(['watch','🍚','식욕 저하가 이틀째예요 (평소보다 적게 먹음)']);
  else if(s0!==null&&s0<=1)A.push(['watch','🍚','오늘 평소보다 많이 적게 먹었어요']);
  if(isT&&H>=20&&!food.length)A.push(['info','🍚','오늘 사료 기록이 아직 없어요']);

  else if(v0===1&&v1>=1)A.push(['alert','🤮','이틀 연속 구토가 있어요']);
  else if(v0===1)A.push(['watch','🤮','오늘 구토 1회']);
  if(byType(L,'vomit').some(l=>(l.item||'').includes('혈액')))A.push(['alert','🤮','구토에 혈액이 섞였다는 기록이 있어요']);
  const cs=byType(L,'cond').map(l=>num(l.value)).filter(v=>v!==null);
  if(cs.length){const mn=Math.min(...cs);if(mn<=1)A.push(['alert','😿','컨디션이 많이 나빠요 ('+mn+'/5)']);else if(mn<=2)A.push(['watch','😾','컨디션이 나빠요 ('+mn+'/5)']);}
  const ct=byType(L,'cond').map(l=>l.item||'').join(',');
  ['숨 가쁨','비틀거림'].forEach(t=>{if(ct.includes(t))A.push(['alert','⚠️',t+' 기록 — 바로 병원에 연락하세요']);});
  const ur=byType(L,'urine');
  if(ur.some(l=>(l.item||'').includes('혈뇨')))A.push(['alert','💛','혈뇨/분홍빛 소변 기록이 있어요']);
  if(isT&&H>=18&&!ur.length)A.push(['info','💛','오늘 소변 기록이 아직 없어요 (화장실 확인)']);
  const st=byType(L,'stool');
  if(st.some(l=>(l.item||'').includes('혈변')))A.push(['watch','💩','혈변 기록이 있어요']);
  if(st.filter(l=>l.value==='설사').length>=2)A.push(['watch','💩','설사가 2회 이상이에요']);
  if(byType(L,'water').some(l=>l.value==='안먹음'))A.push(['watch','💧','물을 안 마신 기록이 있어요']);
  const ws=weightsOf(cat).filter(w=>w.date<=date);
  if(ws.length>=2){
    const w1=ws[ws.length-1];
    const old=ws.filter(w=>w.date>=addDays(w1.date,-30)&&w.date<=addDays(w1.date,-5));
    if(old.length){const w0=num(old[0].qty),dr=(w0-num(w1.qty))/w0;
      if(dr>=0.1)A.push(['alert','⚖️','체중이 '+old[0].date.slice(5)+' 대비 '+(dr*100).toFixed(1)+'% 줄었어요']);
      else if(dr>=0.05)A.push(['watch','⚖️','체중이 '+old[0].date.slice(5)+' 대비 '+(dr*100).toFixed(1)+'% 줄었어요']);}
  }
  const mr=medRows(cat,date);
  const missed=mr.filter(r=>!r.log&&(!isT||(SLOT_DUE[r.slot]&&H>=SLOT_DUE[r.slot])));
  if(missed.length&&date<=today())A.push(['watch','💊','투약 체크 안 된 항목 '+missed.length+'개: '+missed.map(r=>r.slot+' '+r.m.name).join(', ')]);
  const bad=byType(L,'med').filter(l=>l.value==='거부'||l.value==='먹고 토함');
  if(bad.length)A.push(['watch','💊','약을 거부하거나 토한 기록 '+bad.length+'건']);
  byType(L,'symptom').filter(l=>l.value==='악화').forEach(l=>A.push(['watch','🩺','"'+l.item+'" 악화로 기록됨']));
  if(isT){
    D.visits.filter(v=>v.cat===cat&&v.next&&v.next>=date&&diffDays(date,v.next)<=3).forEach(v=>{
      const n=diffDays(date,v.next);A.push(['info','🏥','병원 예약 '+(n===0?'오늘':'D-'+n)+' · '+(v.hospital||'')+' ('+fmtMD(v.next)+')']);});
  }
  return A;
}

function daySummary(cat,date,L){
  if(!L.length&&!medRows(cat,date).length)return '';
  const f=byType(L,'food'),w=byType(L,'water'),sn=byType(L,'snack'),u=byType(L,'urine'),st=byType(L,'stool'),v=byType(L,'vomit'),co=byType(L,'cond'),we=byType(L,'weight'),fl=byType(L,'fluid');
  const mr=medRows(cat,date),md=mr.filter(r=>r.log&&(r.log.value==='완료'||r.log.value==='일부')).length;
  const sa=scoreAvg(f),wa=scoreAvg(w),ca=avg(co.map(l=>num(l.value)).filter(x=>x!==null));
  const cell=(i,t)=>'<div><span>'+i+'</span><span>'+t+'</span></div>';
  const g=[
    cell('🍚',f.length?f.length+'회 · '+(SCALE_LABEL[SCALE[Math.round(sa)]]||'-'):'<span class="muted">기록 없음</span>'),
    cell('💧',w.length?w.length+'회 · '+(SCALE_LABEL[SCALE[Math.round(wa)]]||'-'):'<span class="muted">기록 없음</span>'),
    cell('💛',u.length?sumQty(u)+'덩어리':'<span class="muted">기록 없음</span>'),
    cell('💩',st.length?st.map(l=>l.value).join(', '):'<span class="muted">-</span>'),
    cell('🤮',v.length?sumQty(v)+'회':'없음'),
    cell('😺',ca!==null?ca.toFixed(1)+' / 5':'<span class="muted">-</span>'),
    cell('🍬',sn.length?sn.map(l=>esc(l.item)+(l.qty||1)).join(', '):'<span class="muted">-</span>'),
    cell('⚖️',we.length?we[0].qty+'kg':'<span class="muted">-</span>')
  ];
  if(mr.length)g.push(cell('💊',md+'/'+mr.length+' 완료'));
  if(fl.length)g.push(cell('🩹',fl.reduce((a,l)=>a+(num(l.qty)||0),0)+'ml'));
  return '<div class="card"><h3>📊 하루 요약</h3><div class="sumgrid">'+g.join('')+'</div></div>';
}

function compress(file,max=1400,q=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',q).split(',')[1]});};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('이미지를 읽지 못했어요'));};
    img.src=url;
  });
}

    h+=f.fold&&!(rec&&rec[f.k])?'<details class="fold"><summary>'+f.label+'</summary>'+fieldHtml+'</details>':block;
  });

  h+='<div class="fl">'+(isMemo?'메모':'메모 (선택)')+'</div><textarea data-f="note" rows="'+(isMemo?5:2)+'" placeholder="'+(isMemo?'무엇이든 적어두세요. 예) 오늘 창가에서 오래 누워 있음, 병원 전화 상담 내용…':'특이사항이 있으면 짧게')+'">'+esc(rec?rec.note:'')+'</textarea>';
  h+=photoPicker(rec);
  const d=rec?rec.date:UI.date, t=rec?rec.time:(UI.date===today()?hm():'12:00');

  openSheet(h,{photos:[],onSave:()=>saveLog(type,rec,pre)});
}
function saveLog(type,rec,pre){
  const v=readForm();
  const T=TYPES[type];
  for(const f of T.fields){if(f.req&&!v[f.k]){toast(f.label.replace(/\s*\(.*\)/,'')+'을(를) 선택해 주세요','err');return;}}
  if(type==='weight'&&!num(v.qty)){toast('체중을 숫자로 입력해 주세요','err');return;}
  if(type==='memo'&&!v.note&&!FORM.photos.length){toast('메모 내용을 입력해 주세요','err');return;}
  if(!v.cat){toast('고양이를 선택해 주세요','err');return;}
  const cats=v.cat==='__both'?CATS().map(c=>c.name):[v.cat];
  const base=rec?Object.assign({},rec):{item:pre.item||'',value:'',qty:'',unit:pre.unit||'',note:'',by:cfg.me||'',link:pre.link||''};
  const ops=cats.map((c,i)=>{
    const r=Object.assign({},base,{id:rec?rec.id:uid(),type,cat:c});
    ['date','time','item','value','qty','unit','note'].forEach(k=>{if(v[k]!==undefined)r[k]=v[k];});
    if(!r.date)r.date=UI.date;if(!r.time)r.time=hm();
    return up('logs',r,i===0?FORM.photos:[]);
  });
  const newIds=rec?[]:ops.map(o=>o.record.id);
  closeSheet();
  commit(ops);
  toast(T.icon+' 저장했어요'+(cats.length>1?' (둘 다)':''),'',newIds.length?()=>commit(newIds.map(id=>del('logs',id))):null);
}

/* ===== CHARTS ===== */
function barChart(vals,labels,o={}){
  const W=320,H=o.h||110,pl=o.ylab?36:22,pb=18,pt=12,n=vals.length,bw=(W-pl-4)/n;
  const max=o.max||Math.max(1,...vals.filter(v=>v!==null));
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  [0,.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#EFE7DE"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="8.5" text-anchor="end" fill="#B9AFA6">'+(o.ylab?o.ylab(max*f):+(max*f).toFixed(1))+'</text>';});
  const step=Math.ceil(n/8);
  vals.forEach((v,i)=>{
    const x=pl+i*bw+bw*.18,w=bw*.64;
    if(v===null){s+='<rect x="'+x+'" y="'+(H-pb-3)+'" width="'+w+'" height="3" rx="1.5" fill="#E8E0D7"/>';}
    else{const hh=Math.max(2,(H-pt-pb)*(v/max));const col=o.color?o.color(v):'var(--accent)';s+='<rect x="'+x+'" y="'+(H-pb-hh)+'" width="'+w+'" height="'+hh+'" rx="3" fill="'+col+'"/>';
      if(n<=14&&o.showVal!==false)s+='<text x="'+(x+w/2)+'" y="'+(H-pb-hh-3)+'" font-size="8.5" text-anchor="middle" fill="#8C827A">'+(o.fmt?o.fmt(v):+v.toFixed(1))+'</text>';}
    if(i%step===0||i===n-1)s+='<text x="'+(x+w/2)+'" y="'+(H-5)+'" font-size="8.5" text-anchor="middle" fill="#8C827A">'+labels[i]+'</text>';
  });
  return s+'</svg>';
}
function lineChart(pts,o={}){
  const W=320,H=o.big?170:120,pl=30,pr=10,pt=14,pb=20;
  const ys=pts.map(p=>p.y).filter(v=>v!==null);
  if(!ys.length)return '<div class="empty">데이터 없음</div>';
  let mn=o.min!==undefined?o.min:Math.min(...ys,o.low??Infinity),mx=o.max!==undefined?o.max:Math.max(...ys,o.high??-Infinity);
  if(mn===mx){mn-=1;mx+=1;}const padv=(mx-mn)*.12;if(o.min===undefined)mn=Math.min(...ys)>=0?Math.max(0,mn-padv):mn-padv;if(o.max===undefined)mx+=padv;
  const X=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let s=(o.title?'<div class="ct" style="font-size:13.5px;font-weight:800">'+esc(o.title)+'</div>':'')+'<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  if(o.low!==null&&o.low!==undefined||o.high!==null&&o.high!==undefined){const yl=Y(o.low??mn),yh=Y(o.high??mx);s+='<rect x="'+pl+'" y="'+Math.min(yl,yh)+'" width="'+(W-pl-pr)+'" height="'+Math.abs(yl-yh)+'" fill="#2E9E6A" opacity=".08"/>';}
  [0,.5,1].forEach(f=>{const v=mn+(mx-mn)*f,y=Y(v);s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#EFE7DE"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="8.5" text-anchor="end" fill="#B9AFA6">'+(+v.toFixed(2))+'</text>';});
  const P=pts.map((p,i)=>p.y===null?null:[X(i),Y(p.y),p]).filter(Boolean);
  s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" points="'+P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/>';
  const step=Math.ceil(pts.length/7);
  P.forEach((p,i)=>{const out=(o.high!=null&&p[2].y>o.high)||(o.low!=null&&p[2].y<o.low);s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.4" fill="'+(out?'#D64545':'var(--accent)')+'" stroke="#fff" stroke-width="1.5"/>';if(pts.length<=10||i===P.length-1)s+='<text x="'+p[0]+'" y="'+(p[1]-7)+'" font-size="9" text-anchor="middle" fill="#2B2622" font-weight="700">'+(+p[2].y.toFixed(2))+'</text>';});
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)s+='<text x="'+X(i)+'" y="'+(H-5)+'" font-size="8.5" text-anchor="middle" fill="#8C827A">'+p.x+'</text>';});
  return s+'</svg>';
}

function dailySeries(cat,n){
  const days=[];for(let i=n-1;i>=0;i--)days.push(addDays(today(),-i));
  return days.map(d=>{
    const L=logsOf(cat,d,false),Lc=logsOf(cat,d,true);
    const mr=medRows(cat,d);
    return {d,
      food:scoreAvg(byType(L,'food')),water:scoreAvg(byType(Lc,'water')),
      urine:byType(L,'urine').length?sumQty(byType(L,'urine')):null,
      vomit:L.length?sumQty(byType(L,'vomit')):null,
      cond:avg(byType(L,'cond').map(l=>num(l.value)).filter(v=>v!==null)),
      weight:(byType(L,'weight')[0]||{}).qty?num(byType(L,'weight')[0].qty):null,
      snack:byType(L,'snack').length?byType(L,'snack').reduce((a,l)=>a+(num(l.qty)||1),0):null,
      med:mr.length?Math.round(100*mr.filter(r=>r.log&&(r.log.value==='완료'||r.log.value==='일부')).length/mr.length):null,
      fluid:byType(L,'fluid').length?byType(L,'fluid').reduce((a,l)=>a+(num(l.qty)||0),0):null,

  });
}

/* ===== BRIEF ===== */
function md(s){
  const lines=String(s||'').split('\n');let o='',inUl=false;
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  lines.forEach(l=>{
    if(/^\s*[-*] /.test(l)){if(!inUl){o+='<ul>';inUl=true;}o+='<li>'+inl(l.replace(/^\s*[-*] /,''))+'</li>';return;}
    if(inUl){o+='</ul>';inUl=false;}
    if(/^### /.test(l))o+='<h3>'+inl(l.slice(4))+'</h3>';
    else if(/^## /.test(l))o+='<h2>'+inl(l.slice(3))+'</h2>';
    else if(/^# /.test(l))o+='<h2>'+inl(l.slice(2))+'</h2>';
    else if(l.trim())o+='<p>'+inl(l)+'</p>';
  });
  if(inUl)o+='</ul>';return o;
}

      if(c.concerns&&c.concerns.length)h+='<div class="fl" style="color:var(--alert)">주의할 점</div>'+li(c.concerns,'bad');

      h+='</div>';
    });
    if(j.issues&&j.issues.length)h+='<div class="card"><h3>🩺 증상 경과</h3>'+j.issues.map(i=>'<div class="vis"><b>'+esc(i.cat)+' · '+esc(i.title)+'</b> <span class="tag">'+esc(i.change)+'</span><div class="small muted">'+esc(i.comment)+'</div></div>').join('')+'</div>';

async function genBrief(kind,date){
  if(Q.length)await flush();
  UI.gen=kind+date;render();
  try{
    const r=await jsonp({action:'brief',kind,date},180000);
    if(!r.ok)throw new Error(r.error);
    applyOp({action:'upsert',sheet:'briefs',record:r.brief});saveData();

}

  save:()=>FORM&&FORM.onSave&&FORM.onSave(),
  close:()=>closeSheet(),
  chip:el=>{
    const g=el.closest('.chips');if(!g)return;
    if(g.dataset.k==='me'&&!g.closest('#shc')){cfg.me=el.dataset.v;save(LS.cfg,cfg);render();return;}

    if(g.dataset.multi==='1'){el.classList.toggle('on');return;}
    const was=el.classList.contains('on');
    $$('.chip',g).forEach(c=>c.classList.remove('on'));
    if(!was||g.dataset.req==='1')el.classList.add('on');
  },
  step:el=>{const i=el.parentNode.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+Number(el.dataset.d));},
  addopt:el=>{
    const src=el.dataset.src;const label={foods:'사료 이름',snacks:'간식 이름',members:'이름',meds:'약 이름'}[src]||'이름';

    if(src!=='meds'){const list=(ST()[src]||[]).slice();if(!list.includes(v)){list.push(v);commit([setting(src,list)],{norender:sheetOpen()});}}
    const g=el.closest('.chips');
    if(g&&g.closest('#shc')){$$('.chip',g).forEach(c=>{if(g.dataset.multi!=='1')c.classList.remove('on');});const b=document.createElement('button');b.className='chip on';b.dataset.a='chip';b.dataset.v=v;b.textContent=v;g.insertBefore(b,el);}
    if(src==='members'&&!sheetOpen()){cfg.me=v;save(LS.cfg,cfg);render();}
  },
  rmopt:el=>{const k=el.dataset.k,list=(ST()[k]||[]).slice();if(!confirm('"'+list[+el.dataset.i]+'" 을(를) 목록에서 뺄까요? (지난 기록은 그대로)'))return;list.splice(+el.dataset.i,1);commit([setting(k,list)]);},
  rmphoto:el=>{FORM.photos.splice(+el.dataset.i,1);paintThumbs();},
  zoom:(el,e)=>{e.stopPropagation();const d=document.createElement('div');d.className='lightbox';d.innerHTML='<img src="'+esc(el.dataset.big)+'">';d.onclick=()=>d.remove();document.body.appendChild(d);},
  medtap:el=>medTap(el.dataset.m,el.dataset.s),
  prn:el=>{const m=D.meds.find(x=>x.id===el.dataset.m);openLogForm('med',null,{cat:m.cat,item:m.name+(m.dose?' '+m.dose:''),unit:'필요시',link:m.id});},
  medform:()=>openMedForm(),
  mededit:el=>openMedForm(D.meds.find(m=>m.id===el.dataset.v)),
  delmed:el=>{if(!confirm('이 약을 삭제할까요? (보통은 "중단"으로 바꾸는 걸 추천해요)'))return;closeSheet();commit([del('meds',el.dataset.v)]);},
  issueform:()=>openIssueForm(),
  issueedit:el=>openIssueForm(D.issues.find(i=>i.id===el.dataset.v)),
  issuedetail:el=>openIssueDetail(el.dataset.v),
  issuequick:el=>issueQuick(el.dataset.v,el.dataset.s),
  issuelog:el=>openIssueLog(el.dataset.v),
  issueresolve:el=>{const i=D.issues.find(x=>x.id===el.dataset.v);closeSheet();commit([up('issues',Object.assign({},i,{status:'해결',end:today()})),up('logs',{id:uid(),date:today(),time:hm(),cat:i.cat,type:'symptom',item:i.title,value:'해결',qty:'',unit:'',note:'',by:cfg.me,link:i.id})]);toast('✅ 해결로 표시했어요');},
  delissue:el=>{if(!confirm('증상과 경과 기록을 모두 삭제할까요?'))return;const id=el.dataset.v;closeSheet();commit([del('issues',id)].concat(D.logs.filter(l=>l.link===id&&l.type==='symptom').map(l=>del('logs',l.id))));},
  sugg:el=>{$('#ititle').value=el.dataset.v;},
  visitform:()=>openVisitForm(),
  visitdetail:el=>openVisitDetail(el.dataset.v),
  visitedit:el=>openVisitForm(D.visits.find(v=>v.id===el.dataset.v)),
  delvisit:el=>{if(!confirm('병원 기록과 검사수치를 삭제할까요?'))return;const id=el.dataset.v;closeSheet();commit([del('visits',id)].concat(D.labs.filter(l=>l.visit===id).map(l=>del('labs',l.id))));},
  addlab:()=>{const n=(prompt('검사 항목 이름 (예: ALT, WBC, T4)')||'').trim();if(!n)return;$('#labs').insertAdjacentHTML('beforeend',labRowHtml(n,'',null,true));},
  labtrend:el=>openLabTrend(el.dataset.v),
  htab:el=>{UI.htab=el.dataset.v;render();},
  period:el=>{UI.period=+el.dataset.v;render();},
  gen:el=>genBrief(el.dataset.k,el.dataset.d),
  selbrief:el=>{UI.brief=el.dataset.v;render();},
  openbrief:el=>{UI.brief=el.dataset.v;UI.tab='brief';render();window.scrollTo(0,0);},
  b2todo:el=>{commit([up('todos',{id:uid(),cat:curCat(),kind:'확인',title:el.dataset.v,detail:'AI 브리핑에서 추가',done:'false',by:cfg.me})]);toast('🛒 할 일에 추가했어요');},
  copybrief:async el=>{const b=D.briefs.find(x=>x.id===el.dataset.v);try{await navigator.clipboard.writeText(briefText(b));toast('📋 복사했어요 — 카톡 등에 붙여넣기');}catch(e){toast('복사 실패','err');}},
  sharebrief:async el=>{const b=D.briefs.find(x=>x.id===el.dataset.v);if(navigator.share){try{await navigator.share({title:'가정 관찰 요약',text:briefText(b)});}catch(e){}}else ACT.copybrief(el);},
  addtodo:()=>{const t=$('#tdin').value.trim();if(!t){toast('내용을 입력해 주세요','err');return;}const lines=t.split('\n');const title=lines.shift().trim();const v=readForm($('#view'));$('#tdin').value='';$('#tdin').blur();commit([up('todos',{id:uid(),cat:v.cat||'공통',kind:v.kind||'기타',title,detail:lines.join('\n').trim(),done:'false',by:cfg.me})]);toast('추가했어요');},
  todof:el=>{UI.todoF=el.dataset.v;render();},
  todotoggle:el=>{const t=D.todos.find(x=>x.id===el.dataset.v);const d=t.done!=='true';commit([up('todos',Object.assign({},t,{done:String(d),doneBy:d?cfg.me:'',doneAt:d?stamp():''}))]);if(d)toast('✓ 완료','',()=>commit([up('todos',Object.assign({},t))]));},
  todoedit:el=>openTodoForm(D.todos.find(x=>x.id===el.dataset.v)),
  deltodo:el=>{closeSheet();commit([del('todos',el.dataset.v)]);},
  catform:el=>openCatForm(el.dataset.v),
  savecfg:async()=>{
    const url=$('#cfgurl').value.trim(),key=$('#cfgkey').value.trim();
    await connect(url,key);
  },
  syncnow:()=>{if(!cfg.url){UI.tab='set';render();return;}sync();},
  backup:()=>download('dende-boo-backup-'+today()+'.json',JSON.stringify(D,null,1)),
  reload:()=>location.reload(),
  obdone:async()=>{
    const v=readForm();if(!v.me){toast('이름을 선택해 주세요','err');return;}
    cfg.me=v.me;save(LS.cfg,cfg);
    const url=$('#ob_url').value.trim(),key=$('#ob_key').value.trim();
    closeSheet();render();
    if(url)await connect(url,key);
  }
};
async function connect(url,key){
  if(!url){cfg.url='';cfg.key=key;save(LS.cfg,cfg);toast('기기에만 저장하는 모드예요');render();return;}
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)&&!/^http:\/\/localhost/.test(url)){toast('웹 앱 URL 형식이 아니에요','err');return;}
  const old={...cfg};cfg.url=url;cfg.key=key;
  try{
    const r=await jsonp({action:'ping'});
    if(!r.ok)throw new Error(r.error==='unauthorized'?'접속 키가 맞지 않아요':r.error);
    // first connect: push local-only data
    const hadLocal=!old.url&&(D.logs.length||D.todos.length||D.meds.length||D.visits.length||D.issues.length);
    save(LS.cfg,cfg);
    if(hadLocal&&confirm('이 기기에만 있던 기록을 시트로 올릴까요?')){
      const ops=[];['logs','issues','visits','labs','todos','meds'].forEach(k=>D[k].forEach(r=>{const o=Object.assign({},r);const ph=(o._local||[]).map(s=>({mime:'image/jpeg',data:s.split(',')[1]}));delete o._local;ops.push(Object.assign(up(k,o,ph),{opId:uid()}));}));
      Q.push(...ops);save(LS.queue,Q);
    }
    toast('✅ 연결됐어요');
    await sync();
  }catch(e){cfg=old;toast('연결 실패: '+e.message,'err');}
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||!el.dataset.a)return;
  const f=ACT[el.dataset.a];if(!f)return;
  const ae=document.activeElement;
  if(ae&&ae!==el&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&$('#view').contains(ae))ae.blur();
  if(el.tagName==='BUTTON'||el.dataset.a==='chip')e.preventDefault();
  f(el,e);
});
document.addEventListener('change',async e=>{
  if(e.target.id==='dpick'&&e.target.value){UI.date=e.target.value>today()?today():e.target.value;render();}
  if(e.target.id==='phin'&&FORM){
    for(const f of e.target.files){try{FORM.photos.push(await compress(f));}catch(err){toast(err.message,'err');}}
    e.target.value='';paintThumbs();
  }
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(UI.dirty&&!sheetOpen()){const ae=document.activeElement;if(!(ae&&$('#view').contains(ae)&&/INPUT|TEXTAREA/.test(ae.tagName))){UI.dirty=false;render();}}},150);});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(UI.followToday&&UI.date!==today())UI.date=today();
  sync(true);
});
window.addEventListener('online',()=>sync(true));
setInterval(()=>{UI.followToday=UI.date===today();if(document.visibilityState==='visible'&&cfg.url&&!sheetOpen()&&!UI.gen)sync(true);},90000);

/* ---------- boot ---------- */
UI.followToday=true;
render();
if(!cfg.me)openOnboard();
if(cfg.url)sync(true);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
